name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  BUILD_DIR: build

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_glob: build/ArgentumPlate_artefacts/Release/VST3/**
          - name: macOS
            os: macos-latest
            artifact_glob: build/ArgentumPlate_artefacts/Release/VST3/**
          - name: Linux
            os: ubuntu-latest
            artifact_glob: build/ArgentumPlate_artefacts/Release/VST3/**

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # JUCE on Linux needs a pile of dev packages for ALSA/X11/WebKit/etc,
      # since juce_add_plugin pulls in GUI + audio device backends.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev \
            ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      # Ninja needs cl.exe on PATH; this wires up the MSVC dev environment
      # (same compiler the default VS generator would use).
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Caches the JUCE checkout that CMake's FetchContent pulls down, so
      # repeat builds don't re-clone the whole JUCE repo every time.
      - name: Cache FetchContent (JUCE)
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: ${{ runner.os }}-juce-fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-fetchcontent-

      - name: Configure (CMake)
        run: >
          cmake -B ${{ env.BUILD_DIR }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --parallel

      - name: Locate built VST3
        shell: bash
        run: |
          find "${{ env.BUILD_DIR }}" -iname "*.vst3" -print

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArgentumPlate-VST3-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
